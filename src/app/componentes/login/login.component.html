<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EDÉN Inmobiliaria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<div class="login-container">
  <div class="back-button">
    <button routerLink="/login " type="button" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Volver al Inicio
    </button>
  </div>

  <div class="login-header">
    <h2>EDÉN</h2>
    <p>Accede a tu cuenta de inmobiliaria</p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="username" class="form-label">USUARIO</label>
      <input type="text" class="form-control" formControlName="email" id="username" placeholder="Ingresa tu usuario">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">CONTRASEÑA</label>
      <input type="password" class="form-control" formControlName="contrasenia" id="password" placeholder="Ingresa tu contraseña">
    </div>

    <div class="forgot-password">
      <a routerLink="/recuperar">¿Olvidó su contraseña?</a>
    </div>

    <button type="submit"  class="btn btn-primary">LOGIN</button>
  </form>

  <div class="login-footer">
    <p>¿No tienes una cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
