<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="p-field">
      <label for="email">Correo Electrónico</label>
      <input type="text" pInputText
        id="email"
        formControlName="username"
        placeholder="Ingresa tu correo"
        [style]="{ width: '100%' }"
      />
      <small *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="p-error">
        Por favor, ingresa un correo válido.
      </small>
    </div>
    <div class="p-field">
      <label for="password">Contraseña</label>
      <p-password
        id="password"
        formControlName="password"
        placeholder="Ingresa tu contraseña"
        [feedback]="false"
        [toggleMask]="true"
        [style]="{ width: '100%' }"
      ></p-password>
      <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="p-error">
        La contraseña es requerida.
      </small>
    </div>
    <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage"></p-message>
    <p-button
      type="submit"
      label="Iniciar Sesión"
      [disabled]="loginForm.invalid"
      [loading]="loading"
      styleClass="p-button-raised p-button-primary"
    ></p-button>
  </form>
</div>
